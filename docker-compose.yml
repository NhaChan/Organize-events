services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-event_blog}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-event_blog}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-event_blog}
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - event-blog

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - event-blog

  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-event_blog}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-event_blog}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-event_blog}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DOCKER_DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - event-blog

volumes:
  mysql-data:
  vendor:

networks:
  event-blog:
    driver: bridge
