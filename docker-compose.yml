services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - event-blog

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - event-blog

  mysql:
    image: mysql:latest
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-event_blog}
      MYSQL_USER: ${DB_USERNAME:-event_blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-event_blog}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DOCKER_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - event-blog

  backup:
    image: mysql:latest
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/backup/backup.sh"]
    command: ["loop"]
    environment:
      TZ: ${BACKUP_TIMEZONE:-Asia/Ho_Chi_Minh}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_UID: ${BACKUP_UID:-1000}
      BACKUP_GID: ${BACKUP_GID:-1000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-event_blog}
      DB_USERNAME: ${DB_USERNAME:-event_blog}
      DB_PASSWORD: ${DB_PASSWORD:-event_blog}
    volumes:
      - ./.docker/backup/backup.sh:/opt/backup/backup.sh:ro
      - ./backups:/backups
      - ./storage/app/public:/source/uploads:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - event-blog

volumes:
  mysql-data:
  vendor:

networks:
  event-blog:
    driver: bridge
